[package]
name = "mcode-core"
version = "0.1.0-beta.12"
edition = "2024"
license = "MIT"
description = "MCode 核心库：agent 回合 / 工具 / 配置 / 会话 / 权限 / hooks / mcp / skills"
repository = "https://github.com/materin-tech/mcode-core"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
similar = "2"          # diff 算法（edit_file 卡片渲染源）
globset = "0.4"        # glob 匹配（glob/grep include 工具）
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }  # rustls：musl 目标无 OpenSSL 依赖（openssl-sys 在 x86_64-unknown-linux-musl 编不过）
walkdir = "2"
